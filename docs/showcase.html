<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1b1e27; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  /* mock GUI chrome */
  .chrome { position: fixed; top: 0; left: 0; right: 0; height: 42px; background: #232733; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .chrome .title { color: #9aa3b2; font-size: 13px; margin-left: 8px; }
  .sidebar { position: fixed; left: 0; top: 42px; bottom: 0; width: 208px; background: #232733; padding: 16px 10px; }
  .side-item { color: #b9c0cc; font-size: 13px; padding: 8px 10px; border-radius: 8px; margin-bottom: 2px; }
  .side-item.on { background: #3b4252; color: #fff; }
  .main { position: fixed; left: 208px; top: 42px; right: 0; bottom: 0; background: #1b1e27; }
  /* the pet, as rendered by the plugin */
  .pet-shell { position: absolute; right: 46px; bottom: 78px; width: 140px; height: 140px; cursor: pointer; }
  .pet-img { position: absolute; top: 50%; left: 50%; width: 100%; transform: translate(-50%, -50%); display: block; border-radius: 50%; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
  .bubble { position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); background: #fff; color: #5b3a29; font-size: 14px; line-height: 1.5; padding: 8px 14px; border-radius: 14px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .bubble::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #fff; }
  .nameplate { position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .smoke { position: absolute; left: 49.5%; top: 48%; width: 9px; height: 9px; border-radius: 50%; background: #e8e8ec; box-shadow: 0 0 10px rgba(255,255,255,.5); }
  .tag { position: absolute; right: 18px; top: 64px; color: #7d8597; font-size: 12px; line-height: 1.8; text-align: right; }
</style>
</head>
<body>
  <div class="chrome">
    <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
    <span class="title">DeepSeek Harness · Web GUI</span>
  </div>
  <div class="sidebar">
    <div class="side-item">对话</div>
    <div class="side-item">任务</div>
    <div class="side-item">设置</div>
    <div class="side-item on">我的宠物</div>
    <div class="side-item">插件</div>
  </div>
  <div class="main">
    <div class="tag">dsh-photo-pet<br>照片宠物插件</div>
    <div class="pet-shell">
      <div class="smoke"></div>
      <img class="pet-img" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='ppbg' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffdfc2'/%3E%3Cstop offset='1' stop-color='%23f2b98e'/%3E%3C/linearGradient%3E%3CclipPath id='ppclip'%3E%3Ccircle cx='100' cy='112' r='68'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='100' cy='112' r='68' fill='url(%23ppbg)'/%3E%3Cellipse cx='78' cy='78' rx='26' ry='13' fill='%23fff' opacity='0.25' transform='rotate(-18 78 78)'/%3E%3Cpath d='M58 92 Q74 84 92 92' stroke='%234a3020' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Cpath d='M142 92 Q126 84 108 92' stroke='%234a3020' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='76' cy='104' r='4.5' fill='%233a2418'/%3E%3Ccircle cx='124' cy='104' r='4.5' fill='%233a2418'/%3E%3Cpath d='M100 108 Q112 112 108 126 Q100 132 92 126 Q88 112 100 108 Z' fill='%23e8a878' stroke='%23c98a66' stroke-width='2'/%3E%3Cg clip-path='url(%23ppclip)'%3E%3Ccircle cx='100' cy='158' r='42' fill='rgba(110,80,55,.22)'/%3E%3C/g%3E%3Cpath d='M88 146 Q100 154 112 146' stroke='%235b3a29' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt="pet">
      <div class="bubble">模型工作中,先不闹～</div>
      <div class="nameplate">小宠</div>
    </div>
  </div>
</body>
</html>
