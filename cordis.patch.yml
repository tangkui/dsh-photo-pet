# dsh-photo-pet bundle patch: inserts its plugin row into the web plugin roster.
# The row mounts BOTH halves: the host side (photo storage + /api/photo-pet/*
# routes + the 'photo-pet' settings namespace) and the browser side (the
# modules node half scans dsh.client packages into the web plugin roster,
# served from this package's lib/client.js).
- insert:
    - id: photo-pet
      name: dsh-photo-pet
